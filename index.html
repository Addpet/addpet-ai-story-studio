<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Addpet Story Studio</title><style>
body{margin:0;background:#09090b;color:#f4f4f5;font-family:Arial,sans-serif}header{padding:18px 20px;border-bottom:1px solid #27272a}.gold{color:#fbbf24}main{max-width:900px;margin:auto;padding:30px 18px}.hero{text-align:center;padding:30px 0}.hero h1{font-size:clamp(38px,8vw,64px)}.hero p{color:#a1a1aa;line-height:1.6}.panel{background:#18181b;border:1px solid #27272a;border-radius:18px;padding:20px;margin-top:18px}label{display:block;margin-top:14px;font-weight:bold}textarea,select{width:100%;margin-top:7px;padding:13px;border-radius:10px;border:1px solid #3f3f46;background:#09090b;color:#fff}textarea{min-height:130px}button{margin-top:18px;padding:14px 20px;border:0;border-radius:11px;background:#fbbf24;color:#18181b;font-weight:bold}.status{color:#a1a1aa;margin-top:12px}.result{white-space:pre-wrap;line-height:1.7}</style></head><body>
<header><b>ADDPET <span class="gold">STORY STUDIO</span></b></header><main><section class="hero"><div class="gold">AI STORY GENERATOR</div><h1>Turn an idea into a story.</h1><p>Enter your idea and Addpet will create a structured story package ready for characters, scenes, narration and video production.</p></section>
<section class="panel"><label>Story idea</label><textarea id="idea" placeholder="Example: Two childhood friends reunite after many years, but one has been hiding a painful secret..."></textarea><label>Genre</label><select id="genre"><option>Drama</option><option>Inspirational</option><option>Christian</option><option>Educational</option><option>Comedy</option><option>Thriller</option></select><label>Video format</label><select id="format"><option>9:16 Vertical</option><option>16:9 Landscape</option><option>1:1 Square</option></select><label>Visual style</label><select id="style"><option>Cinematic Realism</option><option>Documentary</option><option>Animation</option><option>Photorealistic</option></select><button id="generate" onclick="generateStory()">✨ Generate Story</button><div class="status" id="status"></div></section>
<section class="panel" id="outPanel" style="display:none"><h2>Generated Story</h2><div class="result" id="output"></div></section></main>
<script>async function generateStory(){const idea=document.getElementById('idea').value.trim(),genre=document.getElementById('genre').value,format=document.getElementById('format').value,style=document.getElementById('style').value,b=document.getElementById('generate'),s=document.getElementById('status'),p=document.getElementById('outPanel'),o=document.getElementById('output');if(!idea){s.textContent='Please enter a story idea.';return}b.disabled=true;s.textContent='Creating your story...';p.style.display='none';try{const r=await fetch('/.netlify/functions/generate-story',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea,genre,format,style})}),d=await r.json();if(!r.ok)throw Error(d.error||'Generation failed');o.textContent=d.story;p.style.display='block';s.textContent='Story generated successfully.'}catch(e){s.textContent='Error: '+e.message}finally{b.disabled=false}}</script></body></html>
